version: 2

project_name: courrier-cli

builds:
  - main: .
    binary: courrier
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/FacileStudio/courrier-cli/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

brews:
  - name: courrier
    homepage: https://github.com/FacileStudio/courrier-cli
    description: Terminal client for Courrier, the suite's self-hosted email service
    directory: Formula
    repository:
      owner: FacileStudio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "courrier"
    test: |
      system "#{bin}/courrier", "--version"
